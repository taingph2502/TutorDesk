[project]
name = "tutordesk-evals"
version = "0.1.0"
description = "Reproducible TutorDesk evaluation harness"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"

[project.scripts]
tutordesk-eval = "tutordesk_evals.cli:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutordesk_evals"]
