name: Quality

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: pnpm --filter @tutordesk/web exec playwright install chromium
      - run: pnpm check

  inventory:
    name: Dependency and license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.21"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - name: Build inventory
        run: |
          mkdir -p artifacts
          pnpm licenses list --json --prod > artifacts/javascript-licenses.json
          uv export --no-dev --no-emit-workspace --format requirements-txt > artifacts/python-requirements.txt
          uv run python tools/python_license_inventory.py > artifacts/python-licenses.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-license-inventory
          path: artifacts/

  compose-substrate:
    name: Docker Compose substrate
    runs-on: ubuntu-latest
    env:
      TUTORDESK_COMPOSE_SMOKE: "1"
      TUTORDESK_DATABASE_PASSWORD: ci-only-compose-contract-password
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: docker compose -f infra/compose/compose.yaml config --quiet
      - run: docker compose -f infra/compose/compose.yaml up --build --wait
      - run: uv run pytest tests/integration/test_compose_substrate.py -q
      - if: always()
        run: docker compose -f infra/compose/compose.yaml down --volumes --remove-orphans
