[project]
name = "tutordesk"
version = "0.1.0"
description = "TutorDesk application and domain distribution"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.118.0,<1",
  "pydantic>=2.11.9,<3",
  "uvicorn[standard]>=0.37.0,<1",
]

[project.scripts]
tutordesk-api = "tutordesk.entrypoints.api:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutordesk"]
